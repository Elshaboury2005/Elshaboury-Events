<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Category Tasks | Workshop Portal</title>
  <meta name="description" content="Manage and track category tasks on the workshop portal." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../css/workshop/workshop.css" />
  <link rel="stylesheet" href="../../css/workshop/workshop-tasks.css" />
</head>
<body>
  <div class="ws-wrapper">
    <!-- Shared Nav -->
    <nav class="ws-nav" aria-label="Workshop navigation"></nav>

    <!-- Header Actions -->
    <div class="ws-header-actions">
      <h2>Category Tasks</h2>
      <button id="wsAddTaskBtn" class="btn btn-violet" type="button">
        ＋ New Task
      </button>
    </div>

    <!-- Kanban Board -->
    <div class="kanban-board" id="kanbanBoard">
      <!-- To Do Column -->
      <div class="kanban-col" data-status="todo">
        <div class="kanban-col-header">
          <span class="col-dot todo-dot"></span>
          <h3>To Do</h3>
          <span class="task-count" id="todoCount">0</span>
        </div>
        <div class="kanban-cards-container" id="colTodo" ondragover="allowDrop(event)" ondrop="dropTask(event, 'todo')"></div>
      </div>

      <!-- In Progress Column -->
      <div class="kanban-col" data-status="in_progress">
        <div class="kanban-col-header">
          <span class="col-dot progress-dot"></span>
          <h3>In Progress</h3>
          <span class="task-count" id="progressCount">0</span>
        </div>
        <div class="kanban-cards-container" id="colProgress" ondragover="allowDrop(event)" ondrop="dropTask(event, 'in_progress')"></div>
      </div>

      <!-- Done Column -->
      <div class="kanban-col" data-status="done">
        <div class="kanban-col-header">
          <span class="col-dot done-dot"></span>
          <h3>Done</h3>
          <span class="task-count" id="doneCount">0</span>
        </div>
        <div class="kanban-cards-container" id="colDone" ondragover="allowDrop(event)" ondrop="dropTask(event, 'done')"></div>
      </div>
    </div>
  </div><!-- /.ws-wrapper -->

  <!-- Task Form Modal -->
  <div class="ws-modal" id="taskModal" style="display:none;">
    <div class="ws-modal-content">
      <div class="ws-modal-header">
        <h3 id="modalTitleText">Create Task</h3>
        <button class="ws-modal-close" id="closeModalBtn" type="button">&times;</button>
      </div>
      <form id="taskForm" class="ws-modal-form">
        <input type="hidden" id="taskIdField" />
        
        <div class="ws-input-group">
          <label for="taskTitle">Task Title *</label>
          <input type="text" id="taskTitle" class="ws-input" placeholder="e.g. Design Event Banner" required />
        </div>

        <div class="ws-input-group">
          <label for="taskDesc">Description</label>
          <textarea id="taskDesc" class="ws-input" rows="4" placeholder="Describe the task expectations..."></textarea>
        </div>

        <div class="ws-form-row">
          <div class="ws-input-group">
            <label for="taskAssignee">Assignee</label>
            <select id="taskAssignee" class="ws-input">
              <option value="">Unassigned</option>
            </select>
          </div>

          <div class="ws-input-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority" class="ws-input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>

        <div class="ws-input-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate" class="ws-input" />
        </div>

        <div class="ws-modal-footer">
          <button type="button" class="btn btn-danger" id="deleteTaskBtn" style="display:none; margin-right:auto;">
            🗑️ Delete
          </button>
          <button type="button" class="btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn btn-violet" id="saveTaskBtn">Save Task</button>
        </div>
      </form>
      <div id="modalMsg" class="ws-message"></div>
    </div>
  </div>

  <script src="../../js/workshop/workshop-nav.js"></script>
  <script src="../../js/workshop/workshop-tasks.js"></script>
</body>
</html>
