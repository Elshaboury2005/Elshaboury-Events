<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage FAQ | Elshaboury Events Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <script src="/public/js/auth-config.js"></script>
  <script src="/admin/js/admin-common.js"></script>
  <script src="/admin/js/admin-layout.js"></script>
</head>
<body>
  <div id="app"></div>

  <!-- Modal overlay for Create/Edit FAQ -->
  <div id="faqModal" class="modal-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1500; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
    <div class="modal" style="background:#0f213b; border:1px solid rgba(255,255,255,0.12); border-radius:16px; width:100%; max-width:550px; overflow:hidden;">
      <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; padding:18px 24px; border-bottom:1px solid rgba(255,255,255,0.08);">
        <div class="modal-title-wrap">
          <h3 class="modal-title" id="modalTitle">Add New FAQ</h3>
        </div>
        <button id="closeModalBtn" class="modal-close" style="background:none; border:none; color:rgba(255,255,255,0.6); font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <div class="modal-body" style="padding:24px;">
        <form id="faqForm" style="display:flex; flex-direction:column; gap:16px;">
          <input type="hidden" id="faqId" />
          <div class="form-group" style="display:flex; flex-direction:column; gap:8px;">
            <label for="faqCategory" style="font-weight:600; font-size:0.9rem;">Category</label>
            <select id="faqCategory" class="form-control" style="padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:#071920; color:#fff;" required>
              <option value="booking">Booking & Tickets</option>
              <option value="wallet">Payments & Wallet</option>
              <option value="accounts">Accounts & Registration</option>
              <option value="organizing">Organizing Events</option>
              <option value="venues">Venues & Bookings</option>
              <option value="support">Technical Support</option>
            </select>
          </div>
          <div class="form-group" style="display:flex; flex-direction:column; gap:8px;">
            <label for="faqQuestion" style="font-weight:600; font-size:0.9rem;">Question</label>
            <textarea id="faqQuestion" class="form-control" style="padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:#071920; color:#fff; min-height:80px; font-family:inherit;" required placeholder="Enter question"></textarea>
          </div>
          <div class="form-group" style="display:flex; flex-direction:column; gap:8px;">
            <label for="faqAnswer" style="font-weight:600; font-size:0.9rem;">Answer</label>
            <textarea id="faqAnswer" class="form-control" style="padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:#071920; color:#fff; min-height:120px; font-family:inherit;" required placeholder="Enter answer"></textarea>
          </div>
          <div class="form-group" style="display:flex; flex-direction:column; gap:8px;">
            <label for="faqSortOrder" style="font-weight:600; font-size:0.9rem;">Sort Order (lower values appear first)</label>
            <input type="number" id="faqSortOrder" class="form-control" style="padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15); background:#071920; color:#fff;" value="0" />
          </div>
          <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:12px;">
            <button type="button" id="cancelModalBtn" class="btn btn-muted" style="padding:10px 18px; border-radius:999px; border:1px solid rgba(255,255,255,0.15); background:none; color:#fff; cursor:pointer;">Cancel</button>
            <button type="submit" class="btn btn-gradient" style="padding:10px 24px; border-radius:999px; border:none; background:linear-gradient(135deg,#ff8a00,#e73886); color:#fff; font-weight:600; cursor:pointer;">Save FAQ</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    (async function init() {
      const ok = await AdminApp.requireAuth();
      if (!ok) return;
      renderAdminLayout('Manage FAQ');

      const page = document.getElementById('pageContent');
      page.innerHTML = `
        <div class="card">
          <div class="section-head">
            <div>
              <h3 class="section-title">FAQ Questions Directory</h3>
              <p class="section-meta">Add, edit, reorder, or delete frequently asked questions that users see on the main FAQ page.</p>
            </div>
            <button id="addFaqBtn" class="btn btn-gradient">+ Add New FAQ</button>
          </div>

          <div class="filters-inline" style="margin-bottom: 20px;">
            <label class="label-stack">Search Q&A
              <input id="faqSearchInput" placeholder="Search by question or answer..." />
            </label>
            <label class="label-stack">Filter by Category
              <select id="faqCategoryFilter">
                <option value="all">All Categories</option>
                <option value="booking">Booking & Tickets</option>
                <option value="wallet">Payments & Wallet</option>
                <option value="accounts">Accounts & Registration</option>
                <option value="organizing">Organizing Events</option>
                <option value="venues">Venues & Bookings</option>
                <option value="support">Technical Support</option>
              </select>
            </label>
          </div>

          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 15%">Category</th>
                  <th style="width: 35%">Question</th>
                  <th style="width: 35%">Answer</th>
                  <th style="width: 5%; text-align: center;">Order</th>
                  <th style="width: 10%; text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="faqTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; padding: 40px; color: var(--muted-text, #9eb6c4);">
                    Loading FAQ directory...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      `;

      const tableBody = document.getElementById('faqTableBody');
      const addFaqBtn = document.getElementById('addFaqBtn');
      const modal = document.getElementById('faqModal');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const faqForm = document.getElementById('faqForm');
      
      const faqSearchInput = document.getElementById('faqSearchInput');
      const faqCategoryFilter = document.getElementById('faqCategoryFilter');

      const modalTitle = document.getElementById('modalTitle');
      const faqIdField = document.getElementById('faqId');
      const faqCategoryField = document.getElementById('faqCategory');
      const faqQuestionField = document.getElementById('faqQuestion');
      const faqAnswerField = document.getElementById('faqAnswer');
      const faqSortOrderField = document.getElementById('faqSortOrder');

      let allFaqs = [];

      // Display Category Nicely
      const categoryMap = {
        booking: 'Booking & Tickets',
        wallet: 'Payments & Wallet',
        accounts: 'Accounts & Registration',
        organizing: 'Organizing Events',
        venues: 'Venues & Bookings',
        support: 'Technical Support'
      };

      async function fetchFaqs() {
        try {
          const res = await AdminApp.request('/Admin/faq');
          const data = await res.json();
          if (data.success && Array.isArray(data.faqs)) {
            allFaqs = data.faqs;
            renderFaqs();
          } else {
            tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Failed to load FAQ list</td></tr>`;
          }
        } catch (err) {
          tableBody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Error connection: ${err.message}</td></tr>`;
        }
      }

      function renderFaqs() {
        const query = faqSearchInput.value.toLowerCase().trim();
        const catFilter = faqCategoryFilter.value;

        const filtered = allFaqs.filter(faq => {
          const matchesSearch = faq.question.toLowerCase().includes(query) || faq.answer.toLowerCase().includes(query);
          const matchesCat = catFilter === 'all' || faq.category === catFilter;
          return matchesSearch && matchesCat;
        });

        if (filtered.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px; color: var(--muted-text, #9eb6c4);">
                No FAQs found matching filters.
              </td>
            </tr>
          `;
          return;
        }

        tableBody.innerHTML = filtered.map(faq => `
          <tr>
            <td>
              <span class="badge badge-outline" style="text-transform: capitalize;">
                ${categoryMap[faq.category] || faq.category}
              </span>
            </td>
            <td><strong>${AdminApp.escapeHtml(faq.question)}</strong></td>
            <td><div style="max-height: 80px; overflow-y: auto; font-size: 0.88rem; color: #9eb6c4;">${AdminApp.escapeHtml(faq.answer)}</div></td>
            <td style="text-align: center;">${faq.sort_order}</td>
            <td style="text-align: right; white-space: nowrap;">
              <button class="btn btn-sm btn-outline-primary edit-btn" data-id="${faq.id}">Edit</button>
              <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${faq.id}">Delete</button>
            </td>
          </tr>
        `).join('');

        // Attach action events
        document.querySelectorAll('.edit-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.target.getAttribute('data-id');
            const faq = allFaqs.find(f => String(f.id) === String(id));
            if (faq) openEditModal(faq);
          });
        });

        document.querySelectorAll('.delete-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.target.getAttribute('data-id');
            deleteFaq(id);
          });
        });
      }

      function openCreateModal() {
        modalTitle.textContent = 'Add New FAQ';
        faqIdField.value = '';
        faqForm.reset();
        faqSortOrderField.value = '0';
        modal.style.display = 'flex';
      }

      function openEditModal(faq) {
        modalTitle.textContent = 'Edit FAQ';
        faqIdField.value = faq.id;
        faqCategoryField.value = faq.category;
        faqQuestionField.value = faq.question;
        faqAnswerField.value = faq.answer;
        faqSortOrderField.value = faq.sort_order;
        modal.style.display = 'flex';
      }

      function closeModal() {
        modal.style.display = 'none';
      }

      async function deleteFaq(id) {
        if (!confirm('Are you sure you want to delete this FAQ question?')) return;
        try {
          const res = await AdminApp.request(`/Admin/faq/${id}`, { method: 'DELETE' });
          const data = await res.json();
          if (data.success) {
            fetchFaqs();
          } else {
            alert(data.message || 'Failed to delete FAQ');
          }
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }

      faqForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = faqIdField.value;
        const category = faqCategoryField.value;
        const question = faqQuestionField.value;
        const answer = faqAnswerField.value;
        const sort_order = parseInt(faqSortOrderField.value, 10) || 0;

        const body = { category, question, answer, sort_order };
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/Admin/faq/${id}` : '/Admin/faq';

        try {
          const res = await AdminApp.request(url, {
            method,
            body: JSON.stringify(body)
          });
          const data = await res.json();
          if (data.success) {
            closeModal();
            fetchFaqs();
          } else {
            alert(data.message || 'Failed to save FAQ');
          }
        } catch (err) {
          alert('Error: ' + err.message);
        }
      });

      addFaqBtn.addEventListener('click', openCreateModal);
      closeModalBtn.addEventListener('click', closeModal);
      cancelModalBtn.addEventListener('click', closeModal);

      // Search & Filters inputs
      faqSearchInput.addEventListener('input', renderFaqs);
      faqCategoryFilter.addEventListener('change', renderFaqs);

      // Fetch init
      fetchFaqs();
    })();
  </script>
</body>
</html>
